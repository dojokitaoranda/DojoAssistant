<style>
/* Layout: dojo-werkblad in Japanse stijl — washi-papier, sumi-inkt, shu-rood (Kyokushin) en ai-indigo; vaste kop met seigaiha-golfjes,
   tabbladen met kleine Japanse titels, daaronder het werkvlak in 1 of 2 kolommen; banden als kleurcodes. */
:root{
  --bg:#F2EEE6; --surface:#FBF9F4; --sunk:#E9E3D8; --ink:#1C1A17; --muted:#6B645A; --line:#D9D1C3;
  --accent:#1F2E52; --accent-ink:#FBF9F4; --accent-soft:#E1E3EB; --kiai:#B5262B; --kanji:#22305E; --gold:#A8843A;
  --s0:#DCD4C6; --s1:#A9B5D3; --s2:#D49A3A; --s3:#3F7D4E; --s-ink:#1C1A17;
  --f-display:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Yu Gothic","Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1B1A18; --sunk:#25231F; --ink:#ECE6DA; --muted:#A39B8D; --line:#34312B;
  --accent:#9FB0DA; --accent-ink:#121110; --accent-soft:#252B3B; --kiai:#E25B54; --kanji:#9FB0DA; --gold:#CDA757;
  --s0:#3A3631; --s1:#4E5F8C; --s2:#C58A2E; --s3:#4F9A63; --s-ink:#ECE6DA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1B1A18; --sunk:#25231F; --ink:#ECE6DA; --muted:#A39B8D; --line:#34312B;
  --accent:#9FB0DA; --accent-ink:#121110; --accent-soft:#252B3B; --kiai:#E25B54; --kanji:#9FB0DA; --gold:#CDA757;
  --s0:#3A3631; --s1:#4E5F8C; --s2:#C58A2E; --s3:#4F9A63; --s-ink:#ECE6DA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25;letter-spacing:.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kiai);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* Kop: papier met een vage seigaiha-golf rechts en een dunne rode lijn eronder */

function belt(gid,tusList=[]){
  if(!Array.isArray(tusList))tusList=[];

  const dan=DAN_STRIPES[gid]||0;for(let i=0;i<dan;i++)st.push("#D4AF37");
  const tus=tusList.length;
  tusList.slice(0,4).forEach(k=>st.push(TUSSEN_COLORS[k]||TUSSEN_COLORS.wit));
  let pos=Math.max(30,96-st.length*12);const stops=[`${base} 0 ${pos}%`];
  st.forEach(c=>{stops.push(`${c} ${pos}% ${pos+7}%`,`${base} ${pos+7}% ${pos+12}%`);pos+=12});
  stops.push(`${base} ${pos}% 100%`);
  const title=(BELT_NAME[gid]||"wit")+(tus?` + tussenstre${tus===1?"ep":"pen"} ${tusList.join(", ")}`:"");

/* Aanwezigheid */
const DAYS=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const DAYS_S=["zo","ma","di","wo","do","vr","za"];
const WEEK_ORDER=[1,2,3,4,5,6,0];
/* Lesgroepen: een dag + wie er standaard bij hoort. Per leerling kan het lidmaatschap afwijken. */
const WHO={all:"Iedereen",junior:"Junioren",senior:"Senioren"};
function groupsCfg(){const g=S.settings.groups;if(Array.isArray(g)&&g.length)return g;
  const d=Array.isArray(S.settings.trainingDays)&&S.settings.trainingDays.length?S.settings.trainingDays:[3,6];
  return d.map(x=>({id:"d"+x,day:x,name:"Training",who:"all"}))}
function trainingDays(){return [...new Set(groupsCfg().map(g=>+g.day))]}
const groupById=id=>groupsCfg().find(g=>g.id===id);
const groupLabel=g=>g?`${DAYS_S[+g.day]} · ${g.name}`:"onbekende groep";
const groupsOnDay=w=>groupsCfg().filter(g=>+g.day===w);
const defaultMember=(s,g)=>g.who==="all"||(g.who==="junior"&&!!s.junior)||(g.who==="senior"&&!s.junior);
function studentGroups(s){const all=groupsCfg();
  if(Array.isArray(s.groups)&&s.groups.length){const v=s.groups.filter(id=>all.some(g=>g.id===id));if(v.length)return v}
  return all.filter(g=>defaultMember(s,g)).map(g=>g.id)}
const attId=(date,gid)=>date+"_"+gid;
const minAtt=()=>Math.min(...attBands().ok);
const wd=s=>dt(s).getDay();
function shiftTraining(from,dir,inclusive){
  const td=trainingDays();const d=dt(from);if(!inclusive)d.setDate(d.getDate()+dir);
  for(let i=0;i<14;i++){if(td.includes(d.getDay()))return iso(d);d.setDate(d.getDate()+dir)}
  return from;
}
function nextDay(from,w){const d=dt(from);for(let i=0;i<7;i++){if(d.getDay()===w)return iso(d);d.setDate(d.getDate()+1)}return from}
function trainingDatesBetween(a,b){const td=trainingDays();const out=[];const d=dt(a);const end=dt(b);while(d<=end){if(td.includes(d.getDay()))out.push(iso(d));d.setDate(d.getDate()+1)}return out}
const firstOf=s=>s.firstName!=null?s.firstName:(s.lastName?String(s.name||""):String(s.name||"").split(" ")[0]);
const lastOf=s=>s.lastName!=null?s.lastName:(s.firstName!=null?"":String(s.name||"").split(" ").slice(1).join(" "));
function ageOn(s,date){const ref=dt(date||today());
  if(s.birthDate){const b=dt(s.birthDate);let a=ref.getFullYear()-b.getFullYear();if(ref.getMonth()<b.getMonth()||(ref.getMonth()===b.getMonth()&&ref.getDate()<b.getDate()))a--;return a}
  if(s.birthYear)return ref.getFullYear()-(+s.birthYear);return null}
const ageTxt=s=>{const a=ageOn(s);return a==null?"":a+" jaar"};
const act=()=>S.students.filter(s=>!s.archived);
const memberOn=(s,date)=>{const j=s.joined||(s.createdAt?iso(new Date(s.createdAt)):"");return !j||j<=date};
const shortName=s=>firstOf(s)+(lastOf(s)?" "+lastOf(s).trim().split(/\s+/).pop()[0]+".":"");
const joinedOf=s=>s.joined||(s.createdAt?iso(new Date(s.createdAt)):"");
function attStats(s){
  const from=[S.settings.attFrom||"",s.lastExam||"",joinedOf(s)].sort().pop();
  const gs=studentGroups(s);const t=today();
  const sess=S.attendance.filter(a=>!a.cancelled&&a.group&&a.date>=from&&a.date<=t&&gs.includes(a.group)).sort((a,b)=>a.date.localeCompare(b.date)||String(a.group).localeCompare(b.group));
  const present=sess.filter(a=>a.present?.[s.id]).length;
  // Geplande lessen van de eigen groepen zonder registratie (tot en met gisteren) tellen als "nog niet ingevoerd".
  const ids=attIdSet();let open=0;
  const openList=[];
  if(from){const y=iso(new Date(Date.now()-864e5));if(from<=y)trainingDatesBetween(from,y).forEach(d=>groupsOnDay(wd(d)).forEach(g=>{if(gs.includes(g.id)&&!ids.has(attId(d,g.id))){open++;openList.push({d,g})}}))}
  return {from,total:sess.length,present,open,openList,pct:sess.length?present/sess.length:null,last:sess.slice(-10).map(a=>!!a.present?.[s.id])};
}
// Cache van registratie-id's; ook vernieuwen als er in dezelfde lijst iets bij komt of af gaat (push/splice)
let _attIds=null,_attSrc=null,_attLen=-1;
function attIdSet(){if(_attSrc!==S.attendance||_attLen!==S.attendance.length){_attSrc=S.attendance;_attLen=S.attendance.length;_attIds=new Set(S.attendance.map(a=>a.id))}return _attIds}
/* Aanwezigheidsklassen (per dojo in te stellen): voldoet ≥ minAtt, bespreken ≥ talkAtt, anders voldoet niet.
   Zolang er open lessen zijn telt de beste mogelijke uitkomst (alle open lessen aanwezig). */
/* Drie vrij in te stellen blokken (van–t/m, 0–100%). Bij overlap telt voldoet > bespreken > voldoet niet;
   een percentage dat in geen blok valt telt als "voldoet niet". */
function attBands(){const b=S.settings.attBands;const m=+S.settings.minAttendance||80,t=S.settings.talkAttendance!=null?+S.settings.talkAttendance:Math.max(0,m-10);
  const d={ok:[m,100],talk:[t,Math.max(t,m-1)],bad:[0,Math.max(0,t-1)]};
  if(!b||typeof b!=="object")return d;const c=(x,f)=>{const v=Math.round(+x);return isFinite(v)&&x!==""&&x!=null?Math.min(100,Math.max(0,v)):f};
  return {ok:[c(b.ok?.[0],d.ok[0]),c(b.ok?.[1],d.ok[1])],talk:[c(b.talk?.[0],d.talk[0]),c(b.talk?.[1],d.talk[1])],bad:[c(b.bad?.[0],d.bad[0]),c(b.bad?.[1],d.bad[1])]}}
function bandOf(p){const B=attBands();const v=Math.round(p);const inR=r=>v>=Math.min(r[0],r[1])&&v<=Math.max(r[0],r[1]);return inR(B.ok)?"ok":inR(B.talk)?"talk":"bad"}
const rangeTxt=k=>{const r=attBands()[k];return `${Math.min(...r)}–${Math.max(...r)}%`};
const talkAtt=()=>Math.min(...attBands().talk);
function attBest(st){const n=st.total+st.open;return n?(st.present+st.open)/n:null}
function attBand(st){const n=st.total+(st.open||0);if(!n)return "none";
  if(st.open){const b=bandOf(attBest(st)*100);return b==="ok"?"open":b}
  return bandOf(st.pct*100)}
const BAND={ok:["ok","voldoet"],talk:["warn","bespreken"],bad:["bad","voldoet niet"],open:["info","onvolledig"],none:["","geen lessen"]};
function attOk(st){const b=attBand(st);return b!=="talk"&&b!=="bad"}
function attPill(st){const b=attBand(st);const [cls,lab]=BAND[b];
  if(b==="none")return `<span class="pill">geen registraties</span>`;
  if(st.pct==null)return `<span class="pill ${cls}">${st.open} les${st.open===1?"":"sen"} nog niet ingevoerd</span>`;
  const p=Math.round(st.pct*100);
  return `<span class="pill ${cls}">${st.open?`${p}% van ${st.total} · ${st.open} open`:`${p}%`} · ${lab}</span>`}
function dotsH(st){return `<span class="dots" aria-label="Laatste lessen">${st.last.map(p=>`<i class="${p?"p":"a"}"></i>`).join("")}</span>`}

function eligibility(s,examDate){
  const gid=targetOf(s);if(!gid)return{ok:true,state:"ok",checks:[],notes:[]};
  const g=G[gid];const checks=[];const st=attStats(s);
  {const b=attBand(st),openTxt=st.open?`${st.open} les${st.open===1?"":"sen"} nog niet ingevoerd`:"";
   const base=st.pct==null?"":`${Math.round(st.pct*100)}% (${st.present} van ${st.total} lessen${st.open?", "+openTxt:""})`;
   if(b==="none")checks.push({l:"Aanwezigheid",st:"warn",t:"nog geen lessen geregistreerd"});
   else if(b==="bad")checks.push({l:"Aanwezigheid",st:"bad",t:`${base||openTxt}: voldoet niet (${rangeTxt("bad")})`});
   else if(b==="talk")checks.push({l:"Aanwezigheid",st:"warn",t:`${base||openTxt}: bespreken (${rangeTxt("talk")})`});
   else if(b==="open")checks.push({l:"Aanwezigheid",st:"warn",t:st.pct==null?openTxt:`${Math.round(st.pct*100)}% van ${st.total} ingevoerde les${st.total===1?"":"sen"}; ${openTxt}`});
   else checks.push({l:"Aanwezigheid",st:"ok",t:`${base}: voldoet (${rangeTxt("ok")})`})}
  {const its=itemsOf(gid);const done=its.filter(x=>(s.progress?.[x.id]||0)===3).length;
   checks.push({l:"Examenonderdelen",st:done===its.length?"ok":"bad",t:done===its.length?`alle ${its.length} onderdelen afgetekend (examenklaar)`:`${done} van ${its.length} onderdelen afgetekend; nog ${its.length-done} te gaan`})}
  const start=s.lastExam||(!s.current||s.current==="0"?joinedOf(s):"");
  if(start){const from=addMonths(start,g.minM);const ref=examDate||today();
    checks.push({l:"Minimale tijd",st:from<=ref?"ok":"bad",t:`${g.minM>=12?g.minM/12+" jaar":g.minM+" maanden"} na ${s.lastExam?"het vorige examen":"de start"}, dus vanaf ${fmtY(from)}`})}
  else checks.push({l:"Minimale tijd",st:"warn",t:"vul de datum van het vorige examen in"});

function pickSpread(items,studs,n){

  const main=Math.max(10,min-open-cool-warm);const wsum=fsel.reduce((a,f)=>a+FOCUS_W[f],0);
  const mins={};let left=main;fsel.forEach((f,i)=>{mins[f]=i===fsel.length-1?left:Math.round(main*FOCUS_W[f]/wsum);left-=mins[f]});
  const B=(type,title,m,items,note="")=>({id:uid(),type,title,min:m,items:items.map(x=>({...x,id:uid(),done:false})),note});
  const lowIdx=ORDER.indexOf(grades[0]),top=grades[grades.length-1];
  const blocks=[B("open","Opening",open,[{t:"Opstellen naar graad, seiza, mokuso"},{t:"Rei: shomen ni rei, sensei ni rei, otagai ni rei"}]),B("warm","Warming-up",warm,pickWarm(warm,jeugd))];
  if(mins.kihon){
    const n=Math.min(10,Math.max(3,Math.round(mins.kihon/3)));
    const kItems=pickSpread(all.filter(x=>["std","sto","blk","trp"].includes(x.c)),studs,n).map(ref);
    if(lowIdx>0&&kItems.length<n+1){const prev=itemsOf(ORDER[lowIdx-1]).filter(x=>["sto","blk","trp"].includes(x.c));if(prev.length){const p=prev[Math.floor(Math.random()*prev.length)];kItems.push({...ref(p),t:p.t+" (herhaling)"})}}
    const stands=[...new Set(all.filter(x=>x.c==="std").map(x=>x.t.split(" (")[0]))];
    blocks.push(B("kihon","Kihon",mins.kihon,kItems,`Eerst op de plaats, daarna in beweging (ido geiko).${stands.length?` Standen: ${stands.join(", ")}.`:""}`));
  }
  if(mins.kata){
    // Niet te veel kata: ongeveer één per 8 minuten, maximaal 3, verspreid over de graden en de minst beheerste eerst.
    const max=Math.min(3,Math.max(1,Math.round(mins.kata/8)));
    const pool=all.filter(x=>x.c==="kata");
    const chosen=pickSpread(pool,studs,max);
    const rest=pool.filter(x=>!chosen.includes(x));
    blocks.push(B("kata","Kata",mins.kata,chosen.map(ref),`Eerst samen op tel, dan per graad zelfstandig. Let op embusen, blikrichting en kiai.${rest.length?` Volgende keer: ${rest.slice(0,4).map(x=>x.t).join(", ")}${rest.length>4?" …":""}.`:""}`));
  }
  if(mins.kumite){
    const n=Math.min(5,Math.max(2,Math.round(mins.kumite/5)));
    const renItems=pickSpread(all.filter(x=>x.c==="ren"),studs,n).map(ref);
    const jk=itemsOf(top).find(x=>x.c==="kum");
    renItems.push({t:`Jiyu-kumite in rondes van 1½ min${jk?` (examen ${G[top].name}: ${jk.t.replace("Jiyu-kumite: ","")})`:""}`,ref:jk?.id||null,g:top});
    blocks.push(B("kumite","Kumite",mins.kumite,renItems,jeugd?"Jeugd: licht contact, met beschermers.":"Eerst renraku in tweetallen, daarna jiyu-kumite."));
  }
  if(mins.cond){
    const condItems=itemsOf(top).filter(x=>x.c==="oef").map(ref);
    if(mins.cond>=12){const extra=WARM.filter(w=>w.c==="kracht"||w.c==="cardio").sort(()=>Math.random()-.5).slice(0,Math.min(4,Math.round(mins.cond/6)));
      extra.forEach(w=>condItems.push({t:`${w.t} (circuit, ${w.m} min)`}))}
    blocks.push(B("cond","Stamina",mins.cond,condItems,`Examennormen ${G[top].name}.${mins.cond>=12?" Als circuit: 40 s werken, 20 s rust, 3 rondes.":""}`));
  }
  const coolItems=[{t:"Ademhaling: Nogare",ref:ORDER.indexOf(top)>=1?"9k_adem_0":null,g:"9k"}];
  if(ORDER.indexOf(top)>=3)coolItems.push({t:"Ibuki sankai",ref:"7k_adem_0",g:"7k"});
  coolItems.push({t:"Statisch rekken: hamstrings, liezen, heupen (elk 20–30 s)"},{t:"Mokuso, rei, afsluiting"});
  blocks.push(B("cool","Cooling-down",cool,coolItems));
  const gr=groupById(group);const fl=fsel.length<FOCUS.length?" ("+fsel.map(f=>FOCUS.find(x=>x[0]===f)[1].toLowerCase()).join(", ")+")":"";
  const gt=grades.length>3?`${G[grades[0]].name} t/m ${G[top].name}`:grades.map(g=>G[g].name).join(" + ");
  return {date:date||today(),title:(gr?gr.name+": ":"")+gt+fl,min,grades,jeugd:!!jeugd,group:gr?gr.id:"",focus:fsel,blocks,notes:"",updatedAt:Date.now()};
}

/* ============ EXAMENPLANNING ============ */
function examPlan(gid,examDate){
  const start=new Date();start.setDate(start.getDate()-((start.getDay()+6)%7));
  const weeks=Math.max(1,Math.ceil((dt(examDate)-start)/(7*864e5)));
  const its=itemsOf(gid);
  const order=["std","sto","blk","trp","kata","ren","adem","alg","kwal","tame"];
  const learn=its.filter(x=>order.includes(x.c)).sort((a,b)=>order.indexOf(a.c)-order.indexOf(b.c));
  // kata vroeg introduceren: tussen de eerste kihon-items schuiven
  const kata=learn.filter(x=>x.c==="kata"),rest=learn.filter(x=>x.c!=="kata");
  const intro=Math.max(1,weeks-2);
  const buckets=Array.from({length:intro},()=>[]);
  kata.forEach((k,i)=>buckets[Math.min(intro-1,i)].push(k));
  rest.forEach((x,i)=>buckets[Math.min(intro-1,Math.floor(i*intro/rest.length))].push(x));
  const oef=its.filter(x=>x.c==="oef").map(x=>x.t);
  const kum=its.find(x=>x.c==="kum");
  const out=[];
  for(let w=0;w<weeks;w++){
    const from=new Date(start);from.setDate(from.getDate()+w*7);
    const e={from:iso(from),items:[],extra:[]};
    if(w<intro&&weeks>2){e.items=buckets[w];e.extra.push(w===0?"Start: uitleg examenprogramma, nulmeting conditie":"Herhaal de onderdelen van vorige week");if(kata.length&&w>0)e.extra.push("Kata elke les herhalen: "+kata.map(k=>k.t).join(", "))}
    else if(weeks<=2&&w===0){e.items=learn;e.extra.push("Korte aanloop: alle onderdelen doornemen")}
    else if(w===weeks-2){e.extra.push("Alle onderdelen herhalen in examenvolgorde","Conditietest: "+oef.join(", "))}
    else{e.extra.push("Proefexamen in examenvolgorde",kum?kum.t:"","Laatste les licht houden; rust voor het examen")}
    e.extra=e.extra.filter(Boolean);out.push(e);
  }
  return out;
}

function vMatrix(){
  const gs=groups();
  const g=S.matrixGrade&&G[S.matrixGrade]?S.matrixGrade:(gs.sort((a,b)=>b.studs.length-a.studs.length)[0]?.g||"10k");
  const studs=act().filter(s=>targetOf(s)===g).sort((a,b)=>a.name.localeCompare(b.name));
  let html=`<div class="row"><span class="label">Examengroep</span><select id="mx-g" data-ch="matrixGrade">${GRADES.map(x=>`<option value="${x.id}"${x.id===g?" selected":""}>Naar ${x.name} (${act().filter(s=>targetOf(s)===x.id).length})</option>`).join("")}</select>
   <span class="small muted">Tik op een vakje om de status te verhogen: – → I → O → ✓</span></div>`;
  if(!studs.length)return html+`<div class="panel flat empty"><h3>Geen leerlingen in deze groep</h3><p>Leerlingen komen hier als hun volgende examen ${G[g].name} is.</p></div>`;

  html+=`<div class="tablewrap tscroll"><table><thead><tr><th style="min-width:220px">Onderdeel</th>${studs.map(s=>`<th class="c" style="min-width:64px" title="${h(s.name)}">${h(shortName(s))}</th>`).join("")}</tr></thead><tbody>`;
  G[g].cats.forEach(([c,l])=>{html+=`<tr class="cathead"><td colspan="${studs.length+1}">${CAT_LABEL[c]}</td></tr>`;
    l.forEach((txt,i)=>{const id=`${g}_${c}_${i}`;html+=`<tr><td>${h(txt)}</td>${studs.map(s=>{const v=s.progress?.[id]||0;return `<td class="c"><button class="cell" data-act="cycle" data-id="${s.id}" data-i="${id}" data-v="${v}" title="${h(s.name)}: ${STATUS[v]}" aria-label="${h(s.name)}, ${h(txt)}: ${STATUS[v]}">${STATUS_SHORT[v]}</button></td>`}).join("")}</tr>`})});
  html+=`<tr><td><b>Totaal klaar</b></td>${studs.map(s=>`<td class="c small"><b>${pct(readiness(s,g))}</b></td>`).join("")}</tr></tbody></table></div>`;
  return html;
}

function syllabusOptions(grades){
  const gs=[...new Set([...(grades||[])])].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  const others=ORDER.filter(g=>!gs.includes(g));

  return `<option value="">Onderdeel uit examenprogramma…</option>${gs.map(grp).join("")}${others.map(grp).join("")}`;
}

function upsertAtt(date,group,fields){
  if(S.readOnly)return toast("Je kunt deze planner alleen bekijken.");
  if(!group)return toast("Stel eerst een lesgroep in bij Instellingen.");
  const id=attId(date,group);const rec=S.attendance.find(a=>a.id===id);
  if(rec){deepMerge(rec,clone(fields));render();Store.patch("attendance",id,fields)}
  else{const d={date,group,present:{},cancelled:false,note:"",...clone(fields)};S.attendance.push({...clone(d),id});render();Store.put("attendance",id,d)}
}
const curRec=()=>S.attendance.find(a=>a.id===attId(curAttDate(),curAttGroup()));

/* Sortering voor "Percentage per leerling" en het rapport: percentage, status, graad of naam. */
const PCT_SORTS=[["pct","Percentage"],["status","Status"],["graad","Graad"],["naam","Naam"]];
const BAND_ORDER={ok:0,open:1,talk:2,bad:3,none:4};
function pctSort(rows,key){const k=S.pctSort||"pct";const gi=s=>s.current&&s.current!=="0"?ORDER.indexOf(s.current):-1;
  const nm=(a,b)=>firstOf(a.s).localeCompare(firstOf(b.s),"nl",{numeric:true})||lastOf(a.s).localeCompare(lastOf(b.s),"nl",{numeric:true});
  const pc=(a,b)=>(b[key].pct??-1)-(a[key].pct??-1)||b[key].present-a[key].present;
  const f={pct:(a,b)=>pc(a,b)||nm(a,b),status:(a,b)=>BAND_ORDER[attBand(a[key])]-BAND_ORDER[attBand(b[key])]||pc(a,b)||nm(a,b),graad:(a,b)=>gi(b.s)-gi(a.s)||nm(a,b),naam:nm}[k]||nm;
  return rows.sort(f)}
const pctSortChips=()=>`<div class="row" role="group" aria-label="Sorteren"><span class="label">Sorteren op</span>${PCT_SORTS.map(([v,l])=>`<button class="chip" data-act="pctSort" data-v="${v}" aria-pressed="${(S.pctSort||"pct")===v}">${l}</button>`).join("")}</div>`;

/* ---------- Aanwezigheidsrapport ---------- */
const REP_ST=BAND;
function repPeriod(){const t=today();const f=S.repFrom||S.settings.attFrom||iso(new Date(new Date().getFullYear(),new Date().getMonth()-2,1,12));return {from:f,to:S.repTo||t}}
function attRange(s,from,to){
  const st=[from,joinedOf(s)].sort().pop();const gs=studentGroups(s);const ids=attIdSet();const y=iso(new Date(Date.now()-864e5));const end=to<y?to:y;
  const recs=S.attendance.filter(a=>a.group&&gs.includes(a.group)&&!a.cancelled&&a.date>=st&&a.date<=to);
  const present=recs.filter(a=>a.present?.[s.id]).length;let open=0;
  if(st<=end)trainingDatesBetween(st,end).forEach(d=>groupsOnDay(wd(d)).forEach(g=>{if(gs.includes(g.id)&&!ids.has(attId(d,g.id)))open++}));
  const r={from:st,total:recs.length,present,absent:recs.length-present,open,pct:recs.length?present/recs.length:null};
  r.state=attBand(r);return r}
function attGroupSummary(from,to){const y=iso(new Date(Date.now()-864e5));
  return sortedGroups().map(g=>{let held=0,cancelled=0,open=0,sumPct=0,nPct=0;
    trainingDatesBetween(from,to).filter(d=>wd(d)===+g.day).forEach(d=>{const r=S.attendance.find(a=>a.id===attId(d,g.id));
      if(r){if(r.cancelled)cancelled++;else{held++;const mem=act().filter(s=>studentGroups(s).includes(g.id)&&memberOn(s,d));if(mem.length){sumPct+=mem.filter(s=>r.present?.[s.id]).length/mem.length;nPct++}}}
      else if(d<=y)open++});
    return {g,held,cancelled,open,avg:nPct?sumPct/nPct:null}})}
function attReportData(){const {from,to}=repPeriod();
  const rows=pctSort(act().map(s=>({s,r:attRange(s,from,to)})),"r");
  return {from,to,rows,groups:attGroupSummary(from,to)}}

    ${S.repShow?`<button class="btn primary" data-act="repPdf" ${S.repBusy?"disabled":""}>${S.repBusy?"PDF maken…":"Download als PDF"}</button>`:""}</div></div>`;
  if(!S.repShow)return html+`<p class="small muted" style="margin:0">Overzicht per lesgroep en per leerling over een gekozen periode, met aanwezig, afwezig, open lessen en percentage.</p></div>`;
  const d=attReportData();
  const cnt=k=>d.rows.filter(x=>x.r.state===k).length;
  html+=`<div class="statrow">
    <div class="panel"><div class="label">Voldoet (${rangeTxt("ok")})</div><div class="stat" style="color:var(--s3)">${cnt("ok")}</div></div>

let jspdfP=null;
function loadJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  if(!jspdfP)jspdfP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej(new Error("jspdf"));s.onerror=()=>{jspdfP=null;rej(new Error("jspdf"))};document.head.appendChild(s)});
  return jspdfP;
}

function imgData(src,tint){return new Promise(res=>{const im=new Image();
  im.onload=()=>{try{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext("2d");x.drawImage(im,0,0);
    if(tint){x.globalCompositeOperation="source-in";x.fillStyle=tint;x.fillRect(0,0,c.width,c.height)}res({d:c.toDataURL("image/png"),w:c.width,h:c.height})}catch(e){res(null)}};
  im.onerror=()=>res(null);im.src=src})}

// Tekent kanji en logo linksboven; geeft de x-positie terug waar de titel kan beginnen.
function drawBrand(doc,b,M){const H=18,y=M-6;let x=M;
  if(b&&b.k){const w=H*b.k.w/b.k.h;doc.addImage(b.k.d,"PNG",x,y,w,H);x+=w+3}
  if(b&&b.l){const r=b.l.w/b.l.h;let w=H*r,hh=H;if(w>30){w=30;hh=30/r}doc.addImage(b.l.d,"PNG",x,y+(H-hh)/2,w,hh);x+=w+4}
  return x}
function monthDates(ym,day){const [y,m]=ym.split("-").map(Number);const out=[];const d=new Date(y,m-1,1,12);while(d.getMonth()===m-1){if(d.getDay()===day)out.push(iso(d));d.setDate(d.getDate()+1)}return out}

    let L=LAYOUTS[1],blanks=2;

        const ty=y+rowH/2+1.3;

/* ---------- Synchroniseren (laptop <-> telefoon via een sync-bestand) ----------
   Samenvoegen in plaats van vervangen: per record wint de nieuwste wijziging (updatedAt).
   Aanwezigheid en voortgang worden per leerling/onderdeel samengevoegd, zodat registraties van beide apparaten blijven staan.
   Verwijderde records worden onthouden (S.deleted) zodat ze niet terugkomen. */
const SYNC_COLLS=["students","lessons","attendance","competitions"];
const deviceName=()=>{try{return localStorage.getItem("kyo-device")||""}catch(e){return ""}};
function syncPayload(){return {app:APP.name,kind:"sync",version:APP.version,device:deviceName()||"onbekend apparaat",exportedAt:new Date().toISOString(),
  students:S.students,lessons:S.lessons,attendance:S.attendance,competitions:S.competitions,settings:S.settings,deleted:S.deleted||{}}}
const stableJSON=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,key)=>(o[key]=x[key],o),{}):x);
function mergeRecord(c,local,inc){
  const lt=+local.updatedAt||0,it=+inc.updatedAt||0;const newer=it>lt?inc:local,older=it>lt?local:inc;
  const out={...clone(older),...clone(newer)};
  if(c==="attendance"&&(older.present||newer.present))out.present={...(older.present||{}),...(newer.present||{})};
  if(c==="students"&&(older.progress||newer.progress))out.progress={...(older.progress||{}),...(newer.progress||{})};
  out.updatedAt=Math.max(lt,it);return out}
function planMerge(inc){
  const plan={put:[],del:[],settings:null,counts:{nieuw:0,bijgewerkt:0,verwijderd:0}};
  const del=inc.deleted||{};const myDel=S.deleted||{};
  for(const c of SYNC_COLLS){
    const mine=new Map((S[c]||[]).map(x=>[x.id,x]));
    for(const rec of inc[c]||[]){if(!rec||!rec.id)continue;
      const tomb=myDel[c]?.[rec.id];if(tomb&&tomb>=(+rec.updatedAt||0))continue;
      const loc=mine.get(rec.id);
      if(!loc){plan.put.push([c,rec.id,clone(rec)]);plan.counts.nieuw++;continue}
      const m=mergeRecord(c,loc,rec);if(stableJSON(m)!==stableJSON({...loc,updatedAt:m.updatedAt})){plan.put.push([c,rec.id,m]);plan.counts.bijgewerkt++}}
    for(const [id,ts] of Object.entries(del[c]||{})){const loc=mine.get(id);if(loc&&ts>=(+loc.updatedAt||0)){plan.del.push([c,id,ts]);plan.counts.verwijderd++}}
  }
  // Instellingen per sleutel samenvoegen: wat op het ene apparaat ontbreekt (bijv. lesgroepen) wordt aangevuld;
  // bij verschillen wint het nieuwste apparaat. Zo komen lesgroepen ook mee uit een oudere back-up zonder tijdstempel.
  if(inc.settings&&typeof inc.settings==="object"){
    const it=+inc.settings.updatedAt||0,lt=+S.settings.updatedAt||0;const incNewer=it>lt||(!lt&&it===0);
    const m=incNewer?{...S.settings,...clone(inc.settings)}:{...clone(inc.settings),...S.settings};m.updatedAt=Math.max(it,lt)||Date.now();
    // Standaardgroepen ("Training", id d3/d6) zijn geen echte keuze: echte lesgroepen van het andere apparaat gaan voor.
    // Ook als de binnenkomende aanwezigheid groepen gebruikt die hier niet bestaan, worden die lesgroepen overgenomen.
    const isDefault=gs=>!Array.isArray(gs)||!gs.length||gs.every(g=>/^d\d$/.test(g.id));
    const incG=inc.settings.groups,locG=S.settings.groups;
    if(Array.isArray(incG)&&incG.length&&!isDefault(incG)){
      const used=new Set((inc.attendance||[]).map(a=>a.group).filter(Boolean));const locIds=new Set((Array.isArray(locG)?locG:[]).map(g=>g.id));
      if(isDefault(locG)||[...used].some(id=>!locIds.has(id)&&incG.some(g=>g.id===id)))m.groups=clone(incG)}
    if(inc.settings.attFrom&&!S.settings.attFrom)m.attFrom=inc.settings.attFrom;
    const strip=o=>{const c={...o};delete c.updatedAt;return c};
    if(stableJSON(strip(m))!==stableJSON(strip(S.settings)))plan.settings=m}
  return plan}
async function applyMerge(plan,inc){
  for(const [c,id,data] of plan.put)await Store.put(c,id,data,true);
  for(const [c,id,ts] of plan.del)await Store.del(c,id,ts);
  for(const c of SYNC_COLLS)for(const [id,ts] of Object.entries((inc.deleted||{})[c]||{})){S.deleted=S.deleted||{};(S.deleted[c]=S.deleted[c]||{});if(!(S.deleted[c][id]>=ts))S.deleted[c][id]=ts}
  if(plan.settings){const ld=S.settings.dojoLogoData;S.settings={...plan.settings};if(ld&&!S.settings.dojoLogoData)S.settings.dojoLogoData=ld;
    if(Store.db)await guard(()=>Store.db.doc("settings/main").set(S.settings))}
  Store.persistLocal();try{localStorage.setItem("kyo-lastsync",JSON.stringify({at:Date.now(),from:inc.device||""}))}catch(e){}
  render()}
function vSync(){
  let last=null;try{last=JSON.parse(localStorage.getItem("kyo-lastsync")||"null")}catch(e){}
  const p=S.pendingSync;
  return `<div class="panel stack">

    ${last?`<span class="small muted">Laatst samengevoegd: ${new Date(last.at).toLocaleString("nl-NL",{dateStyle:"medium",timeStyle:"short"})}${last.from?" (van "+h(last.from)+")":""}</span>`:""}

  </div>`}

function vCloud(){
  if(Store.mode==="db"||!Cloud.available())return "";

  const loginForm=`<div class="stack" style="gap:8px">

const mmss=s=>{const n=Math.abs(Math.round(s));return (s<0?"+":"")+String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};

/* ---------- Rondetimer (tabata, kumite-ronden, eigen schema) ---------- */
// Fases: yōi (aftellen vooraf) → hajime (ronde) → yasume (pauze) → hajime … → yame (klaar).
// De tijd loopt op de klok (Date.now), zodat pauzeren of een vergrendeld scherm de tijd niet verschuift.
// Instellingen per apparaat in localStorage (gemak, geen gedeelde gegevens).
const RT_KEY="kyo-rtimer";
const RT_PRESETS=[["Tabata",{rounds:8,work:20,rest:10}],["Kumite 3 × 2 min",{rounds:3,work:120,rest:60}],["Conditie 6 × 1 min",{rounds:6,work:60,rest:30}]];
const RT_PH={prep:["Klaar maken","用意 · yōi"],work:["Ronde","始め · hajime"],rest:["Pauze","休め · yasume"],done:["Klaar","止め · yame"]};
let RT=null,rtInt=null,rtWake=null,rtAudio=null;
function rtCfg(){const c={rounds:8,work:20,rest:10,prep:10};try{Object.assign(c,JSON.parse(localStorage.getItem(RT_KEY)||"{}"))}catch(e){}return c}
const rtFmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const rtSummary=c=>`${c.rounds} × ${rtFmt(c.work)} ronde${c.rest?` met ${rtFmt(c.rest)} pauze`:", zonder pauze"} · totaal ${rtFmt((c.prep||0)+c.rounds*c.work+(c.rounds-1)*c.rest)} min`;
function openRT(){RT={cfg:rtCfg(),phase:"setup"};$("#rtimer").hidden=false;document.body.style.overflow="hidden";renderRT()}
function closeRT(){clearInterval(rtInt);rtInt=null;RT=null;const el=$("#rtimer");el.hidden=true;el.className="";if(!S.dojo)document.body.style.overflow="";try{rtWake?.release()}catch(e){}rtWake=null}
// Geluid via Web Audio (geen bestanden nodig). Wordt bij "Start" ontgrendeld (nodig op iPhone).
function rtBeep(pattern){try{
  const a=rtAudio||(rtAudio=new (window.AudioContext||window.webkitAudioContext)());if(a.state==="suspended")a.resume();
  let t=a.currentTime+0.03;
  for(const [f,ms] of pattern){const d=ms/1000,o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.01);g.gain.setValueAtTime(0.35,t+Math.max(0.02,d-0.04));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+0.02);t+=d+0.09}}catch(e){}}
const RT_SND={work:[[880,750]],rest:[[620,260],[620,260]],done:[[880,280],[880,280],[1175,1000]],tick:[[1000,80]]};
function rtReadCfg(){if(!$("#rt-rounds"))return RT.cfg;const n=(id,d)=>{const v=parseInt($(id)?.value,10);return isNaN(v)?d:Math.max(0,v)};const c=RT.cfg;
  c.rounds=Math.min(99,Math.max(1,n("#rt-rounds",c.rounds)));
  c.work=Math.max(1,n("#rt-wm",0)*60+Math.min(59,n("#rt-ws",0)));c.rest=n("#rt-rm",0)*60+Math.min(59,n("#rt-rs",0));
  c.prep=n("#rt-prep",c.prep);return c}
function rtStart(){const c=rtReadCfg();try{localStorage.setItem(RT_KEY,JSON.stringify(c))}catch(e){}
  rtBeep([[1,1]]);// geluid ontgrendelen tijdens de klik
  RT={cfg:c,phase:c.prep>0?"prep":"work",round:1,left:(c.prep>0?c.prep:c.work)*1000,running:true};
  if(RT.phase==="work")rtBeep(RT_SND.work);
  try{navigator.wakeLock?.request("screen").then(w=>rtWake=w).catch(()=>{})}catch(e){}
  rtRun();renderRT()}
function rtRun(){clearInterval(rtInt);RT.last=Date.now();rtInt=setInterval(rtStep,100)}
function rtStep(){if(!RT||!RT.running)return;const now=Date.now();const before=Math.ceil(RT.left/1000);RT.left-=now-RT.last;RT.last=now;
  const after=Math.ceil(RT.left/1000);if(after!==before&&after>0&&after<=3)rtBeep(RT_SND.tick);
  if(RT.left<=0){let guard=0;while(RT&&RT.running&&RT.left<=0&&guard++<200)rtNext(-RT.left);renderRT()}else rtPaint()}
// Naar de volgende fase; 'over' = de tijd die al over de grens is gelopen (blijft kloppen)
function rtNext(over){const c=RT.cfg;over=Math.max(0,over||0);
  if(RT.phase==="prep"){RT.phase="work";RT.left=c.work*1000-over;rtBeep(RT_SND.work)}
  else if(RT.phase==="work"){
    if(RT.round>=c.rounds){RT.phase="done";RT.left=0;RT.running=false;clearInterval(rtInt);rtInt=null;rtBeep(RT_SND.done);return}
    if(c.rest>0){RT.phase="rest";RT.left=c.rest*1000-over;rtBeep(RT_SND.rest)}
    else{RT.round++;RT.left=c.work*1000-over;rtBeep(RT_SND.work)}}
  else if(RT.phase==="rest"){RT.round++;RT.phase="work";RT.left=c.work*1000-over;rtBeep(RT_SND.work)}}
function rtPhaseLen(){const c=RT.cfg;return ({prep:c.prep,work:c.work,rest:c.rest}[RT.phase]||1)*1000}
function rtPaint(){if(!RT||RT.phase==="setup")return;const t=$("#rt-time"),b=$("#rt-bar");
  if(t)t.textContent=rtFmt(Math.max(0,Math.ceil(RT.left/1000)));if(b)b.style.width=Math.max(0,Math.min(100,100-RT.left/rtPhaseLen()*100))+"%"}
function renderRT(){const el=$("#rtimer");if(!RT||!el)return;
  if(RT.phase==="setup"){const c=RT.cfg;el.className="";
    el.innerHTML=`<div class="rt">
      <div class="row between"><h2>Rondetimer</h2><button class="btn" data-act="rtClose">Sluiten</button></div>
      <div class="panel stack">
        <div class="field"><span class="label">Snel kiezen</span><div class="row" style="gap:6px">${RT_PRESETS.map(([n],i)=>`<button type="button" class="chip" data-act="rtPreset" data-i="${i}">${h(n)}</button>`).join("")}</div></div>
        <div class="fields">
          <label class="field"><span class="label">Aantal ronden</span><input type="number" id="rt-rounds" min="1" max="99" inputmode="numeric" value="${c.rounds}" data-ch="rtCfg"></label>
          <div class="field"><span class="label">Duur van een ronde (min : sec)</span><div class="rt-dur"><input type="number" id="rt-wm" min="0" max="99" inputmode="numeric" value="${Math.floor(c.work/60)}" data-ch="rtCfg" aria-label="Minuten ronde">:<input type="number" id="rt-ws" min="0" max="59" inputmode="numeric" value="${c.work%60}" data-ch="rtCfg" aria-label="Seconden ronde"></div></div>
          <div class="field"><span class="label">Duur van de pauze (min : sec)</span><div class="rt-dur"><input type="number" id="rt-rm" min="0" max="99" inputmode="numeric" value="${Math.floor(c.rest/60)}" data-ch="rtCfg" aria-label="Minuten pauze">:<input type="number" id="rt-rs" min="0" max="59" inputmode="numeric" value="${c.rest%60}" data-ch="rtCfg" aria-label="Seconden pauze"></div></div>
          <label class="field"><span class="label">Aftellen vooraf</span><select id="rt-prep" data-ch="rtCfg">${[0,5,10,15,30].map(s=>`<option value="${s}"${+c.prep===s?" selected":""}>${s?s+" seconden":"geen"}</option>`).join("")}</select></label>
        </div>
        <div class="small"><b id="rt-sum">${rtSummary(c)}</b></div>
        <div class="small muted">Geluid aan het eind van elke ronde en pauze; de laatste 3 seconden tikken. Zet het volume van je toestel aan (op de iPhone ook de stille modus uit).</div>
      </div>
      <div class="rt-btns"><button class="btn primary" data-act="rtStart">Start</button></div>
    </div>`;return}
  const ph=RT_PH[RT.phase],c=RT.cfg;el.className="ph-"+RT.phase;
  const next=RT.phase==="done"?"":RT.phase==="work"?(RT.round>=c.rounds?"Daarna: klaar":c.rest?`Daarna: pauze ${rtFmt(c.rest)}`:`Daarna: ronde ${RT.round+1}`):`Daarna: ronde ${RT.phase==="prep"?1:RT.round+1} (${rtFmt(c.work)})`;
  el.innerHTML=`<div class="rt">
    <div class="row between"><span class="small muted">Rondetimer · ${c.rounds} × ${rtFmt(c.work)}${c.rest?" / "+rtFmt(c.rest):""}</span><button class="btn" data-act="rtClose">Sluiten</button></div>
    <div class="rt-ph">${ph[0]}<span class="tj" lang="ja">${ph[1]}</span></div>
    <div class="rt-time" id="rt-time" aria-live="off">${RT.phase==="done"?"0:00":rtFmt(Math.max(0,Math.ceil(RT.left/1000)))}</div>
    <div class="rt-round">${RT.phase==="done"?`Alle ${c.rounds} ronden gedaan · 押忍`:RT.phase==="prep"?`${c.rounds} ronden`:`Ronde ${RT.round} van ${c.rounds}`}${RT.running||RT.phase==="done"?"":" · gepauzeerd"}</div>
    ${RT.phase==="done"?"":`<div class="rt-bar"><i id="rt-bar" style="width:0"></i></div><div class="small muted" style="text-align:center">${next}</div>`}
    <div class="rt-btns">${RT.phase==="done"
      ?`<button class="btn primary" data-act="rtStart">Opnieuw</button><button class="btn" data-act="rtSetup">Instellingen</button>`
      :`<button class="btn primary" data-act="rtPause">${RT.running?"Pauze":"Doorgaan"}</button><button class="btn" data-act="rtSkip">Volgende →</button><button class="btn" data-act="rtSetup">Stoppen</button>`}</div>
    <div class="small muted" style="text-align:center">Tip: op de laptop pauzeer je met de spatiebalk.</div>
  </div>`;rtPaint()}
document.addEventListener("keydown",e=>{if(!RT||RT.phase==="setup"||RT.phase==="done"||e.code!=="Space"||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;e.preventDefault();ACT.rtPause()});

async function saveDraft(){const d=S.draft;if(!d)return;await Store.put("lessons",d.id,clone(d));S.dirty=false}
function openLesson(id){const l=S.lessons.find(x=>x.id===id);if(!l)return;if(S.dirty)saveDraft();S.selLesson=id;S.draft=clone(l);S.dirty=false;S.confirm=null;S.tab="lessen";render();window.scrollTo({top:0})}
async function createLesson(data){if(S.readOnly)return toast("Je kunt deze planner alleen bekijken.");const id=uid();await Store.put("lessons",id,data);S.selLesson=id;S.draft={...clone(data),id};S.dirty=false;S.tab="lessen";render();window.scrollTo({top:0})}
function setProg(sid,item,v){
  const s=S.students.find(x=>x.id===sid);if(!s)return;
  s.progress=s.progress||{};s.progress[item]=v;render();
  Store.patch("students",sid,{progress:{[item]:v}});
}

    S.passSel=[];render();toast(`${ids.length} leerling${ids.length===1?"":"en"} bijgewerkt naar de nieuwe graad.`)},
  sfilter:el=>{S.studentFilter=el.dataset.v;S.selStudent=null;render()},
  sarchive:el=>{const s=S.students.find(x=>x.id===el.dataset.id);if(!s)return;const a=!s.archived;const p={archived:a,archivedAt:a?today():""};Object.assign(s,p);
    S.studentFilter=a?"archief":"actief";render();Store.patch("students",s.id,p);toast(a?`${s.name} staat in het archief.`:`${s.name} is weer actief.`)},
  sgrpReset:el=>{const s=S.students.find(x=>x.id===el.dataset.id);if(!s)return;s.groups=[];render();Store.patch("students",s.id,{groups:[]})},
  grpAdd:()=>{const gs=clone(groupsCfg());gs.push({id:"g"+uid(),day:3,name:"Nieuwe groep",who:"all"});Store.settings({groups:gs})},
  grpDel:el=>{const gs=clone(groupsCfg());const i=+el.dataset.i;const g=gs[i];if(!g)return;const k="dg-"+g.id;if(S.confirm!==k){S.confirm=k;render();return}S.confirm=null;
    if(gs.length<2)return;gs.splice(i,1);Store.settings({groups:gs})},
  djAtt:()=>{const date=S.draft?.date,grp=S.draft?.group;if(S.dirty)saveDraft();S.dojo=null;clearInterval(tick);tick=null;$("#dojo").hidden=true;document.body.style.overflow="";if(date)S.attDate=date;if(grp)S.attGroup=grp;S.tab="aanwezigheid";render();window.scrollTo({top:0})},
  logoRemove:async()=>{const key=dojoKey();
    const ld={...(S.settings.dojoLogoData||{})};if(ld[key]){delete ld[key];await Store.settings({dojoLogoData:ld})}
    const logos={...(S.settings.dojoLogos||{})};const old=logos[key];if(old){delete logos[key];await Store.settings({dojoLogos:logos});if(S.assets)S.assets.delete(old).catch(()=>{})}
    toast("Logo verwijderd.")},
  backupExport:async()=>{const data={app:APP.name,version:APP.version,exportedAt:new Date().toISOString(),dojo:dojoLabel()||"",
      students:S.students,lessons:S.lessons,attendance:S.attendance,competitions:S.competitions,settings:S.settings};
    await offerFile(safeName(`Back-up Dojo Assistant ${dojoShortName()||""} ${fmtNL(today())}`)+".json",JSON.stringify(data,null,1))},
  backupApply:()=>{const b=S.pendingImport;if(!b)return;S.students=b.students||[];S.lessons=b.lessons||[];S.attendance=b.attendance||[];S.competitions=b.competitions||[];S.settings=b.settings||{};if(!S.settings.updatedAt)S.settings.updatedAt=Date.now();S.deleted=b.deleted||{};
    S.pendingImport=null;S.selStudent=null;S.selLesson=null;S.draft=null;S.selComp=null;S.cdraft=null;Store.persistLocal();render();toast("Back-up teruggezet.")},
  backupCancel:()=>{S.pendingImport=null;render()},
  syncExport:async()=>{const dn=deviceName()||"apparaat";const ts=new Date();const stamp=`${fmtNL(iso(ts))} ${String(ts.getHours()).padStart(2,"0")}.${String(ts.getMinutes()).padStart(2,"0")}`;
    await offerFile(safeName(`Dojo Assistant sync ${dn} ${stamp}`)+".json",JSON.stringify(syncPayload()))},
  syncApply:async()=>{const p=S.pendingSync;if(!p)return;S.pendingSync=null;await applyMerge(p.plan,p.inc);
    toast(`Samengevoegd: ${p.plan.counts.nieuw} nieuw, ${p.plan.counts.bijgewerkt} bijgewerkt, ${p.plan.counts.verwijderd} verwijderd.`)},
  syncCancel:()=>{S.pendingSync=null;render()},
  dojo:el=>openDojo(el.dataset.id),
  closeDojo:()=>{if(S.dirty)saveDraft();closeDojo()},
  djRun:()=>{const d=S.dojo;d.running=!d.running;clearInterval(tick);if(d.running)tick=setInterval(djTick,1000);const b=$("#dj-run");if(b)b.textContent=d.running?"Pauze":"Start"},
  djReset:()=>{const d=S.dojo;d.left=(+S.draft.blocks[d.i].min||0)*60;renderDojo()},
  djMin:el=>{const d=S.dojo;const b=S.draft.blocks[d.i];const dm=+el.dataset.d;b.min=Math.max(0,(+b.min||0)+dm);d.left+=dm*60;touchDraft()},
  djGo:el=>{const d=S.dojo;d.i=Math.max(0,Math.min(S.draft.blocks.length-1,d.i+(+el.dataset.d)));d.left=(+S.draft.blocks[d.i].min||0)*60;renderDojo();$("#dojo").scrollTo({top:0})}
};
const IN={
  q:el=>{S.q=el.value;const pos=el.selectionStart;render();const n=$("#s-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},
  lesson:el=>{S.draft[el.dataset.f]=el.value;touchDraft(false)},
  comp:el=>{if(!S.cdraft)return;S.cdraft[el.dataset.f]=el.value;touchComp(false)},
  centry:el=>{const e=S.cdraft?.entries[+el.dataset.i];if(!e)return;const v=el.value.replace(",",".");e[el.dataset.f]=v===""?null:+v;touchComp(false)},
  compQ:el=>{S.compQ=el.value;const pos=el.selectionStart;render();const n=$("#cp-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},
  block:el=>{S.draft.blocks[+el.dataset.b][el.dataset.f]=el.value;touchDraft(false)}
};
const CH={
  rtCfg:()=>{if(!RT)return;const s=$("#rt-sum");if(s)s.textContent=rtSummary(rtReadCfg())},
  sfield:el=>{const f=el.dataset.f;let v=el.value;if(f==="birthYear")v=v?+v:"";if(f==="tussen")v=+v||0;if(["birthPlace","ifkNumber","nkaNumber"].includes(f))v=v.trim();if(f==="name"&&!v.trim())return;const s=S.students.find(x=>x.id===el.dataset.id);if(s)s[f]=v;
    const p={[f]:v};if(f==="birthDate"){p.birthYear=v?+v.slice(0,4):"";if(s)s.birthYear=p.birthYear}if(f==="current"){S.progGrade=null;if(s&&s.tussen){s.tussen=0;p.tussen=0}}Store.patch("students",el.dataset.id,p);requestRender()},
  sname:el=>{const s=S.students.find(x=>x.id===el.dataset.id);if(!s)return;const fn=($("#sd-first")?.value||"").trim(),ln=($("#sd-last-name")?.value||"").trim();
    if(!fn)return toast("Vul een voornaam in.");const p={firstName:fn,lastName:ln,name:(fn+" "+ln).trim()};Object.assign(s,p);Store.patch("students",s.id,p);requestRender()},
  stus:el=>{const s=S.students.find(x=>x.id===el.dataset.id);if(!s)return;const k=tusOf(s);k[+el.dataset.i]=el.value;s.tussenKleuren=k;render();Store.patch("students",s.id,{tussenKleuren:k})},
  sjunior:el=>{const s=S.students.find(x=>x.id===el.dataset.id);if(!s)return;s.junior=el.checked;render();Store.patch("students",s.id,{junior:el.checked})},
  progGrade:el=>{S.progGrade=el.value;render()},
  matrixGrade:el=>{S.matrixGrade=el.value;S._tsTop=0;render()},
  planGrade:el=>{S.planGrade=el.value;render()},
  examDate:el=>{Store.settings({examDate:el.value})},
  attDate:el=>{if(el.value){S.attDate=el.value;render()}},
  tcell:el=>{const s=S.students.find(x=>x.id===el.dataset.id);if(!s)return;if(S.readOnly)return toast("Je kunt deze planner alleen bekijken.");
    const f=el.dataset.f;const v=el.type==="checkbox"?el.checked:el.value.trim();const p={};
    if(f==="firstName"||f==="lastName"){const fn=f==="firstName"?v:firstOf(s),ln=f==="lastName"?v:lastOf(s);if(!fn){toast("Vul een voornaam in.");el.value=firstOf(s);return}Object.assign(p,{firstName:fn,lastName:ln,name:(fn+" "+ln).trim()})}
    else if(f==="birthDate"){p.birthDate=v;p.birthYear=v?+v.slice(0,4):""}
    else if(f==="current"){p.current=v;if(s.tussen)p.tussen=0}
    else p[f]=v;
    Object.assign(s,p);if(el.type!=="checkbox")el.classList.toggle("empty",!v);Store.patch("students",s.id,p)},
  passSel:el=>{const s=new Set(S.passSel||[]);if(el.checked)s.add(el.dataset.id);else s.delete(el.dataset.id);S.passSel=[...s];S.confirm=null;render()},
  resDate:el=>{S.resultDate=el.value},
  clRole:async el=>{try{await Cloud.setRole(el.dataset.email,el.value);toast("Rol aangepast.")}catch(e){toast("Aanpassen is niet gelukt.")}render()},
  compC:el=>{if(!S.cdraft)return;S.cdraft[el.dataset.f]=el.value;touchComp()},
  dojoSel:el=>{Store.settings({dojoId:el.value})},
  devName:el=>{try{localStorage.setItem("kyo-device",el.value.trim())}catch(e){}},
  syncImport:el=>{const f=el.files&&el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const inc=JSON.parse(rd.result);if(!inc||!Array.isArray(inc.students))throw new Error("geen sync");
      S.pendingSync={inc,plan:planMerge(inc)};render()}catch(e){toast("Dit bestand is geen sync-bestand van Dojo Assistant.")}};rd.readAsText(f)},
  backupImport:el=>{const f=el.files&&el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const b=JSON.parse(rd.result);if(!b||!Array.isArray(b.students))throw new Error("geen back-up");S.pendingImport=b;render()}
      catch(e){toast("Dit bestand is geen back-up van Dojo Assistant.")}};rd.readAsText(f)},
  logoUpload:async el=>{
    const f=el.files&&el.files[0];if(!f)return;const key=dojoKey();
    if(!key)return toast("Kies eerst een dojo.");
    if(!S.assets&&(Store.mode==="local"||Store.mode==="cloud")){ // losse versie: logo verkleind als afbeelding in de instellingen bewaren
      const url=URL.createObjectURL(f);const im=new Image();
      im.onload=async()=>{try{const sc=Math.min(1,400/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc)||400;c.height=Math.round(im.naturalHeight*sc)||400;
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);await Store.settings({dojoLogoData:{...(S.settings.dojoLogoData||{}),[key]:c.toDataURL("image/png")}});toast("Logo opgeslagen.")}
        catch(e){toast("Dit logo kon niet worden opgeslagen.")}finally{URL.revokeObjectURL(url)}};
      im.onerror=()=>{URL.revokeObjectURL(url);toast("Dit bestand kan niet als afbeelding worden gelezen.")};im.src=url;return}
    if(!S.assets)return toast("Je kunt hier geen logo uploaden.");
    toast("Logo uploaden…");
    try{const r=await S.assets.upload(f);const logos={...(S.settings.dojoLogos||{})};const old=logos[key];logos[key]=r.id;
      await Store.settings({dojoLogos:logos});if(old&&old!==r.id)S.assets.delete(old).catch(()=>{});toast("Logo opgeslagen.")}
    catch(e){const c=e&&e.code;toast(c==="too_large"?"Het bestand is te groot (svg max. 2 MB, andere max. 20 MB).":c==="unsupported_type"?"Gebruik een png, jpg, webp, gif of svg.":c==="rate_limited"?"Even wachten en dan opnieuw proberen.":"Uploaden is niet gelukt. Probeer het opnieuw.")}
  },
  printMonth:el=>{S.printMonth=el.value},
  repDate:el=>{if(!el.value)return;S[el.dataset.f]=el.value;render()},
  printGroup:el=>{const s=new Set(S.printSkip||[]);if(el.checked)s.delete(el.dataset.g);else s.add(el.dataset.g);S.printSkip=[...s]},
  attNote:el=>{upsertAtt(curAttDate(),curAttGroup(),{note:el.value})},
  grpField:el=>{const gs=clone(groupsCfg());const g=gs[+el.dataset.i];if(!g)return;const f=el.dataset.f;let v=el.value;if(f==="day")v=+v;if(f==="name"&&!v.trim())return render();g[f]=f==="name"?v.trim():v;Store.settings({groups:gs})},
  nlGroup:el=>{const n=S.newLesson;n.group=el.value;const g=groupById(n.group);if(g){
    const tg=[...new Set(act().filter(s=>studentGroups(s).includes(g.id)).map(targetOf).filter(Boolean))];if(tg.length)n.grades=tg;n.jeugd=g.who==="junior";
    if(wd(n.date)!==+g.day)n.date=nextDay(n.date,+g.day)}render()},
  setting:el=>{const f=el.dataset.f;let v=el.value;
    Store.settings({[f]:v})},
  bandField:el=>{const B=clone(attBands());const v=Math.min(100,Math.max(0,Math.round(+el.value||0)));B[el.dataset.k][+el.dataset.i]=v;
    B[el.dataset.k]=[Math.min(...B[el.dataset.k]),Math.max(...B[el.dataset.k])];Store.settings({attBands:B,minAttendance:B.ok[0]})},
  nl:el=>{const f=el.dataset.f;const n=S.newLesson;n[f]=el.type==="checkbox"?el.checked:(f==="min"?+el.value:el.value);
    if(f==="date"&&n.date){const g=groupById(n.group);if(!g||+g.day!==wd(n.date)){const dg=groupsOnDay(wd(n.date));if(dg[0]){n.group=dg[0].id;render()}}}},
  lessonC:el=>{S.draft[el.dataset.f]=el.value;touchDraft()},
  blockMin:el=>{S.draft.blocks[+el.dataset.b].min=Math.max(0,+el.value||0);touchDraft()},
  addSyl:el=>{const it=ITEM[el.value];if(!it)return;S.draft.blocks[+el.dataset.b].items.push({id:uid(),t:it.t,ref:it.id,g:it.g,done:false});touchDraft()},
  addWarm:el=>{const w=WARM.find(x=>x.id===el.value);if(!w)return;const b=S.draft.blocks[+el.dataset.b];b.items.push({id:uid(),t:`${w.t} (${w.m} min)`,warm:w.id,done:false});touchDraft()},
  djTick:el=>{const b=S.draft.blocks[S.dojo.i];b.items[+el.dataset.i].done=el.checked;touchDraft()}
};
const FORM={
  addStudent:()=>{const n=$("#ns-name").value.trim();const ln=($("#ns-last")?.value||"").trim();if(!n)return;if(S.readOnly)return toast("Je kunt deze planner alleen bekijken.");const id=uid();
    Store.put("students",id,{name:(n+" "+ln).trim(),firstName:n,lastName:ln,current:$("#ns-grade").value,lastExam:"",birthYear:"",notes:"",progress:{},createdAt:Date.now()});S.selStudent=id;S.progGrade=null;render();const f=$("#ns-name");if(f)f.value=""},
  clAdd:async()=>{const email=($("#cl-new-email")?.value||"").trim();if(!/^\S+@\S+\.\S+$/.test(email))return toast("Vul een geldig e-mailadres in.");
    try{await Cloud.addMember(email,$("#cl-new-role").value,($("#cl-new-name")?.value||"").trim());S.invite=email.toLowerCase();toast(`${email} heeft nu toegang. Stuur hieronder de uitnodiging.`);
      render();$("#cl-invite")?.scrollIntoView({behavior:"smooth",block:"nearest"});return}
    catch(e){toast(/duplicate/i.test(e?.message||"")?"Dit e-mailadres staat er al.":"Uitnodigen is niet gelukt.")}render()},
  addComp:()=>{const n=$("#nc-name").value.trim();if(!n)return;if(S.readOnly)return toast("Je kunt deze planner alleen bekijken.");
    const id=uid();const data={name:n,date:$("#nc-date").value||"",location:$("#nc-loc").value.trim(),entries:[],locked:false,exports:[],createdAt:Date.now(),updatedAt:Date.now()};
    Store.put("competitions",id,data);S.selComp=id;S.cdraft={...clone(data),id};S.cdirty=false;S.compQ="";render();window.scrollTo({top:0})},
  addFree:el=>{const inp=el.querySelector("input");const t=inp.value.trim();if(!t)return;S.draft.blocks[+el.dataset.b].items.push({id:uid(),t,done:false});touchDraft()},
  djAdd:()=>{const inp=$("#dj-add");const t=inp.value.trim();if(!t)return;S.draft.blocks[S.dojo.i].items.push({id:uid(),t,done:false});touchDraft()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener("input",e=>{const el=e.target.closest("[data-in]");if(el)IN[el.dataset.in]?.(el,e)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-ch]");if(el)CH[el.dataset.ch]?.(el,e)});
document.addEventListener("submit",e=>{const el=e.target.closest("[data-form]");if(!el)return;e.preventDefault();FORM[el.dataset.form]?.(el,e)});
document.addEventListener("keydown",e=>{
  const t=e.target;if(e.key==="Enter"&&t&&t.matches&&t.matches('input[data-ch="tcell"]')&&t.type!=="checkbox"){
    e.preventDefault();const all=[...document.querySelectorAll(`input[data-ch="tcell"][data-f="${t.dataset.f}"]`)];const n=all[all.indexOf(t)+(e.shiftKey?-1:1)];
    if(n){n.focus();if(n.select&&n.type==="text")n.select()}else t.blur()}});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sec){S.secOpen={...(S.secOpen||{}),[d.dataset.sec]:d.open};try{localStorage.setItem("kyo-sec",JSON.stringify(S.secOpen))}catch(x){}}},true);
try{S.secOpen=JSON.parse(localStorage.getItem("kyo-sec")||"{}")}catch(x){S.secOpen={}}
try{S.attSort=localStorage.getItem("kyo-attsort")||"graad"}catch(x){S.attSort="graad"}
try{S.pctSort=localStorage.getItem("kyo-pctsort")||"pct"}catch(x){S.pctSort="pct"}
try{S.candSort=localStorage.getItem("kyo-candsort")||"status"}catch(x){S.candSort="status"}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.dojo){if(S.dirty)saveDraft();closeDojo()}});
window.addEventListener("pagehide",()=>{if(S.dirty)saveDraft();if(S.cdirty)saveComp()});

render();
Store.init();
</script>

<script>if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
